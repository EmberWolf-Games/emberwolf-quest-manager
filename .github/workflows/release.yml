name: Release Foundry module

on:
  push:
    tags:
      - '*.*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Package and publish the tagged version
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate version and build package assets
        run: node .github/scripts/package-release.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(dist/module.json dist/emberwolf-quest-manager.zip)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            release_args=(--verify-tag --title "EWQM $RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == 0.* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}"
          fi
