name: Release Foundry module

on:
  push:
    branches:
      - main
    paths:
      - module.json

permissions:
  contents: write

jobs:
  release:
    name: Package and publish the manifest version
    runs-on: ubuntu-latest
    steps:
      - name: Check out versioned main source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read module version
        id: release-version
        shell: bash
        run: |
          version="$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync("module.json", "utf8")).version)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate version and build package assets
        run: node .github/scripts/package-release.mjs
        env:
          RELEASE_TAG: ${{ steps.release-version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-version.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          assets=(dist/module.json dist/emberwolf-quest-manager.zip)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            release_args=(--target "$GITHUB_SHA" --title "EWQM $RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == 0.* ]]; then
              release_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" "${release_args[@]}"
          fi
